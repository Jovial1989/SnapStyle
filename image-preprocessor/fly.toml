# Fly.io config — Fashion Preprocessing Engine (FastAPI + rembg u2netp).
# Region sin (Singapore) — bom had no Machine capacity at deploy time; sin is
# the nearest region to the Supabase project (Mumbai), ~50ms away. Machines stop when idle (scale-to-zero) and wake on request.
app = "snapstyle-preprocessor"
primary_region = "sin"

# Explicit process command — the machine ran with init={} relying on the image
# CMD, and nothing ever listened; this pins the command at the Machine level.
[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"

[build]
  dockerfile = "Dockerfile"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb" # u2netp ONNX session + OpenCV comfortably fit in 1 GB

[checks]
  [checks.http]
    type = "http"
    port = 8000
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
