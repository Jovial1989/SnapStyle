<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Looktok vector atelier</title>
<style>
  html,body{margin:0;height:100%;background:#F6F5F2;font:14px -apple-system,system-ui;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #fig{position:relative;height:88vh}
  #fig img{position:absolute;display:block}
  #avatar{inset:0;width:100%;height:100%}
  .slot{object-fit:contain;object-position:top center}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
       display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{padding:10px 16px;border-radius:999px;border:1px solid #E4E4E1;background:#fff;color:#0A0A0A;
        font-weight:700;font-size:13px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .chip.on{background:#0A0A0A;color:#fff;border-color:#0A0A0A}
  #brand{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;font-weight:800;color:#0A0A0A}
  #brand i{font-style:normal;color:#8C8C88;font-weight:600}
</style>
<div id="stage">
  <div id="fig">
    <img id="avatar" src="svg/avatar.svg">
    <img id="bottom" class="slot" hidden>
    <img id="top" class="slot" hidden>
  </div>
</div>
<div id="brand">looktok <i>· vector atelier</i></div>
<div id="hud"></div>
<script>
// Garments are placed on the BODY, not on guessed percentages of the frame:
// anchors.json carries the shoulder / waist / hip / knee / ankle lines derived
// from the user's own silhouette (landmarks.py — the same arithmetic ports to
// Dart), so any photo framing dresses correctly.
const SLOTS = {
  top:    [{ label: 'Tee', url: 'svg/tee.svg' }],
  bottom: [
    { label: 'Chinos', url: 'svg/chinos.svg', hem: 'ankleY' },
    { label: 'Shorts', url: 'svg/shorts.svg', hem: 'kneeY' },
  ],
};

const fig = document.getElementById('fig');
const els = { top: document.getElementById('top'), bottom: document.getElementById('bottom') };

fetch('svg/anchors.json').then(r => r.json()).then(a => {
  const [iw, ih] = a.image;
  fig.style.aspectRatio = `${iw} / ${ih}`;
  const pct = v => (v * 100).toFixed(2) + '%';
  const place = (el, cx, w, y0, y1) => {
    el.style.left = pct(cx - w / 2);
    el.style.width = pct(w);
    el.style.top = pct(y0);
    el.style.height = pct(y1 - y0);
  };
  // Sized from the REAL silhouette at each line, with a small margin so the
  // new piece fully covers whatever the user already wears underneath.
  const layout = {
    top: () => place(els.top, a.centerX, a.chestW * 1.04,
                     a.shoulderY - 0.015, a.hipY + 0.01),
    bottom: (item) => {
      const w = (item.hem === 'kneeY' ? a.hipW : a.hipW * 0.98) * 1.06;
      place(els.bottom, a.centerX, w, a.hipY - 0.055, a[item.hem] + 0.03);
    },
  };

  const hud = document.getElementById('hud');
  for (const kind of ['top', 'bottom']) {
    for (const item of SLOTS[kind]) {
      const b = document.createElement('div');
      b.className = 'chip';
      b.textContent = item.label;
      b.onclick = () => {
        const el = els[kind];
        const was = b.classList.contains('on');
        for (const c of hud.children) {
          if (SLOTS[kind].some(i => i.label === c.textContent)) c.classList.remove('on');
        }
        if (was) { el.hidden = true; return; }   // tap again = take it off
        b.classList.add('on');
        layout[kind](item);
        el.src = item.url;
        el.hidden = false;
      };
      hud.appendChild(b);
    }
  }
});
</script>
